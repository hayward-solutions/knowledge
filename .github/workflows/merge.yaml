name: Merge
run-name: Merge ${{ github.ref_name }} - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/merge.yaml'
            docker:
              - 'api/**'
              - 'web/**'

  build:
    name: Publish Docker Images
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        container:
          - name: api
            context: api
          - name: web
            context: web
        arch:
          - amd64
          - arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute version
        id: vars
        run: echo "version=main-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:${{ matrix.container.context }}"
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.container.name }}:main-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.container.name }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.container.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.container.name }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}

  publish-manifests:
    name: Publish multi-arch manifests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          set -euo pipefail
          for img in api web; do
            repo="${{ env.REGISTRY }}/${{ github.repository }}/${img}"
            docker buildx imagetools create -t "${repo}:main" "${repo}:main-amd64" "${repo}:main-arm64"
            docker buildx imagetools create -t "${repo}:${GITHUB_SHA}" "${repo}:${GITHUB_SHA}-amd64" "${repo}:${GITHUB_SHA}-arm64"
          done
