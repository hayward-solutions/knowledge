services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "5432:5432"

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 20

  rustfs-createbucket:
    image: amazon/aws-cli:2.39.2
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ${STORAGE_S3_BUCKET:-knowledge-dev} ||
      aws --endpoint-url http://rustfs:9000 s3 mb s3://${STORAGE_S3_BUCKET:-knowledge-dev}
      "

  api:
    build:
      context: ./api
      args:
        VERSION: ${VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
      rustfs-createbucket:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://knowledge:knowledge@db:5432/knowledge?sslmode=disable}
      API_PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Change-Me-On-First-Boot-1}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-name}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-knowledge-dev}
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ENDPOINT: http://rustfs:9000
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        VERSION: ${VERSION:-dev}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
  rustfs_data:
